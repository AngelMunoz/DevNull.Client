name: Create Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Release Data
        id: extract
        run: |
          VERSION_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -n 1)

          if [ -z "$VERSION_LINE" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi

          LINE_NUM=$(echo "$VERSION_LINE" | cut -d: -f1)
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*## \[([^]]+)\].*/\1/')

          echo "Found version: $VERSION at line $LINE_NUM"

          NEXT_HEADER_LINE=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | grep -n "^## \[" | head -n 1 | cut -d: -f1)

          if [ -z "$NEXT_HEADER_LINE" ]; then
            BODY=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md)
          else
            BODY=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | head -n $((NEXT_HEADER_LINE - 1)))
          fi

          echo "$BODY" > RELEASE_NOTES.md

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.extract.outputs.version }} already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Keep Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  test:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Core tests
        run: dotnet run --project tests/DevNull.Client.Core.Tests -- --summary

      # The global-state and real-time tests mark themselves sequenced
      # in the test list, so the parallel default is safe: Expecto
      # drains the pool before it runs them alone.
      - name: UI tests
        run: dotnet run --project tests/DevNull.Client.UI.Tests -- --summary

  build:
    needs: [prepare, test]
    if: needs.prepare.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        # macOS waits: the scheme registration fails there by design, and a
        # release needs an .app bundle plus codesigning first
        include:
          - runs-on: ubuntu-latest
            rid: linux-x64
          - runs-on: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Native AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # One head per RID: the shared client lives in DevNull.Client.UI,
      # the platform services in the Windows and Linux heads. Both keep
      # the DevNull.Client assembly name, so the bundles and the
      # registered scheme handlers keep working across the split.
      # CHANGELOG.md is the source of truth: KeepAChangelog.Tasks stamps the
      # assemblies during publish. The NoWarn for FSharp.Core's AOT warnings
      # lives in src/Directory.Build.props; this gate still fails on any
      # warning located in this repository's code.
      - name: Publish (Native AOT)
        shell: bash
        run: >
          project=src/DevNull.Client.Linux;
          if [ "${{ matrix.rid }}" = "win-x64" ]; then project=src/DevNull.Client.Windows; fi;
          dotnet publish "$project" -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true -p:TreatWarningsAsErrors=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd publish
          # the .dbg symbols stay out of the bundle
          tar -czf "../DevNull.Client-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" --exclude='*.dbg' .

      # DebugType=none emits no symbols on Windows; the remove is the
      # defensive guard. The WPF native support files ride the
      # System.Reactive framework reference; this Avalonia app never
      # loads them, so they stay out of the bundle. Publish output is
      # flat, so root-level entries are the whole bundle.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item publish\*.pdb, publish\*.dbg -ErrorAction SilentlyContinue
          Remove-Item publish\wpfgfx_cor3.dll, publish\PresentationNative_cor3.dll, publish\PenImc_cor3.dll, publish\vcruntime140_cor3.dll, publish\D3DCompiler_47_cor3.dll -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("publish", "DevNull.Client-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip", "Optimal", $false)

      - name: Verify the Windows bundle is a real zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("DevNull.Client-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip")
          try {
            $exe = $zip.Entries | Where-Object { $_.Name -eq 'DevNull.Client.exe' }
            if (-not $exe) { throw "DevNull.Client.exe missing from the bundle" }
            "zip verified: $($zip.Entries.Count) entries"
          } finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.rid }}
          path: DevNull.Client-*

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The checkout cleans the workspace, so it runs before the
      # artifact download; the other way around it deletes the files
      # the manifest and the release body read.
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Scoop installs straight from the release: the rendered manifest rides
      # the release assets, and releases/latest/download/devnull-client.json
      # always serves the newest stable copy (GitHub skips prereleases there).
      # The .sha256 sidecar lets a manifest refresh read the hash without
      # re-downloading the zip.
      - name: Scoop manifest
        shell: bash
        run: |
          zip="DevNull.Client-${{ needs.prepare.outputs.version }}-win-x64.zip"
          hash="$(sha256sum "artifacts/$zip" | cut -d' ' -f1)"
          printf '%s  %s\n' "$hash" "$zip" > "artifacts/$zip.sha256"
          sed -e "s/@VERSION@/${{ needs.prepare.outputs.version }}/g" \
              -e "s/@HASH@/$hash/g" \
              .github/scoop/devnull-client.json > artifacts/devnull-client.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: artifacts/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-rc') || contains(needs.prepare.outputs.version, '-beta') || contains(needs.prepare.outputs.version, '-alpha') }}
          files: |
            artifacts/DevNull.Client-*
            artifacts/devnull-client.json

  # The flatpak builds from the release tarball, so the release must
  # exist first: the manifest carries the release URL and its hash, the
  # way flatpak-builder verifies every source. The bundle attached
  # beside the tarballs installs directly with
  # `flatpak install --user <file>` before the update channel exists.
  flatpak:
    needs: [prepare, release]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      FLATPAK_REPO: ${{ github.workspace }}/channel/repo
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: bundle-linux-x64
          path: artifacts

      - name: Install flatpak-builder and the freedesktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08

      # The channel's ostree repository lives on the flatpak branch and
      # only there; main never carries it. Each release builds on top
      # of the previous state, so updates stay delta-sized.
      - name: Fetch the channel repository
        run: |
          mkdir -p channel
          if git fetch origin flatpak; then
            git archive origin/flatpak docs/repo | tar -x -C channel
            mv channel/docs/repo channel/repo
            # git cannot carry an ostree repo's empty directories, and
            # build-update-repo needs refs/remotes to exist.
            mkdir -p channel/repo/refs/remotes channel/repo/refs/mirrors channel/repo/tmp
          else
            echo "No channel branch yet; this release starts it."
          fi

      - name: Build the flatpak
        run: |
          hash="$(sha256sum "artifacts/DevNull.Client-${VERSION}-linux-x64.tar.gz" | cut -d' ' -f1)"
          .github/flatpak/build.sh "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/DevNull.Client-${VERSION}-linux-x64.tar.gz" \
            "$hash"

      - name: Bundle for direct install
        run: |
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$FLATPAK_REPO" \
            "DevNull.Client-${VERSION}-linux-x64.flatpak" \
            me.tunaxor.devnull.unoffclient stable

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${VERSION}" \
            "DevNull.Client-${VERSION}-linux-x64.flatpak" \
            --repo "${{ github.repository }}" --clobber

      # Static deltas are not optional on a plain-HTTPS host: without
      # them every update walks the object list one file at a time.
      # Prune keeps the site under the 1 GB Pages cap.
      - name: Update the channel repository
        run: |
          flatpak build-update-repo \
            --generate-static-deltas --prune --prune-depth=2 \
            channel/repo

      - name: Publish the channel branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin flatpak; then
            git checkout -B flatpak FETCH_HEAD
          else
            git checkout --orphan flatpak
            git rm -rf .
          fi
          rm -rf docs
          mkdir -p docs
          cp -a channel/repo docs/repo
          cp .github/flatpak/me.tunaxor.devnull.unoffclient.flatpakref docs/
          cp .github/flatpak/index.html docs/
          touch docs/.nojekyll
          git add -A
          git commit -m "chore: flatpak channel v${VERSION}"
          git push origin flatpak
